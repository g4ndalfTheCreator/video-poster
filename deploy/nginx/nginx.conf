# video-share edge. Runs unprivileged (listens on 8080/8443 inside the container).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  types {
    application/vnd.apple.mpegurl m3u8;
    video/iso.segment m4s;
    text/vtt vtt;
  }
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/vnd.apple.mpegurl text/vtt;

  # Operational access log without personal data (IP truncated to /24 or /48).
  map $remote_addr $ip_anon {
    ~^(?<a>\d+\.\d+\.\d+)\.\d+$ $a.0;
    ~^(?<b>[0-9a-fA-F]+:[0-9a-fA-F]*:[0-9a-fA-F]*): $b:;
    default -;
  }
  map $request_uri $uri_masked {
    ~^/media/[^/]+/\d+/(?<rest>.*)$ /media/***/$rest;
    ~^(?<p>[^?]*)\? $p?***;
    default $request_uri;
  }
  log_format ops escape=json '{"ts":"$time_iso8601","ip":"$ip_anon","m":"$request_method","u":"$uri_masked",'
                             '"s":$status,"b":$bytes_sent,"rt":$request_time}';
  access_log /dev/stdout ops;

  # Viewer telemetry: one JSON line per media request, shipped to the worker over syslog (UDP).
  log_format media escape=json '{"ts":"$time_iso8601","sess":"$msess","vid":"$mvid","ver":"$mver",'
                               '"file":"$mfile","status":$status,"bytes":$bytes_sent,"rt":$request_time,'
                               '"proto":"$server_protocol","tls":"$ssl_protocol","ip":"$remote_addr",'
                               '"ua":"$http_user_agent"}';

  # Admin network allowlist (generated from ADMIN_ALLOW_CIDRS at startup).
  geo $admin_allowed {
    default 0;
    include /etc/nginx/generated/admin-allow.conf;
  }

  limit_req_zone $binary_remote_addr zone=ingest:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=slug:10m rate=60r/m;
  limit_req_status 429;

  # Proxies in front of nginx (EDGE_TRUSTED_PROXIES); empty by default.
  include /etc/nginx/generated/real-ip.conf;

  upstream api_upstream {
    server api:3000;
    keepalive 16;
  }

  include /etc/nginx/conf.d/*.conf;
}
